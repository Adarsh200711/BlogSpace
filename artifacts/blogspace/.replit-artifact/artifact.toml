kind = "web"
previewPath = "/"
title = "BlogSpace"
description = "A full-stack blogging platform where readers can discover published posts, create and manage their own writing, and discuss articles through persistent comments."
version = "1.0.0"
id = "artifacts/blogspace"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23101

[services.development]
run = "pnpm --filter @workspace/blogspace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/blogspace", "run", "build" ]
serve = "static"
publicDir = "artifacts/blogspace/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23101"
BASE_PATH = "/"
